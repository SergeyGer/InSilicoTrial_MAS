# Dependabot configuration.
#
# Weekly, grouped and conventional: minor/patch bumps arrive as one reviewable PR per
# ecosystem, majors arrive individually so they can be scheduled against a test run
# (`make check`, `make test-spark`) rather than merged blindly.
version: 2

# Branch protection requires pull requests to be up to date with main, so
# Dependabot rebases its own branches (`rebase-strategy: auto`) and minor/patch
# updates arrive grouped. Without grouping, each merged bump invalidated the
# others and the queue never drained.

updates:
  # Core runtime, optional extras and dev tooling: pyproject.toml, requirements.txt,
  # requirements-dev.txt.
  - package-ecosystem: "pip"
    rebase-strategy: "auto"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    assignees:
      - "SergeyGer"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps):"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions pinned in .github/workflows/ (CI and CodeQL).
  - package-ecosystem: "github-actions"
    rebase-strategy: "auto"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    assignees:
      - "SergeyGer"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps):"
    groups:
      # One reviewable PR per week for routine action bumps. Major versions stay
      # outside the group so they can be scheduled against a full CI run.
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Terraform providers used by the Unity Catalog / AWS storage module.
  - package-ecosystem: "terraform"
    rebase-strategy: "auto"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "SergeyGer"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(deps):"
    groups:
      terraform-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images used by the Dockerfile (`python:3.12-slim-bookworm`).
  - package-ecosystem: "docker"
    rebase-strategy: "auto"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "SergeyGer"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps):"
