name: Demo site

# Publishes the interactive readout generated by the simulation itself, so that a
# reader can open the dashboard and the report without installing anything. The page
# is the product of a real run on synthetic data: 400 patients, 6 epochs.

on:
  push:
    branches: [main]
    paths:
      - "docs/media/**"
      - "src/insilico_trial_mas/ui/**"
      - "src/insilico_trial_mas/reporting/**"
      - "conf/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate the demo readout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tracking]'
      - name: Run the demo
        run: |
          python -m insilico_trial_mas.cli demo \
            --patients 400 --epochs 6 --output-dir artifacts/pages --json > demo.json
      - name: Assemble the site
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil

          summary = json.loads(pathlib.Path("demo.json").read_text())
          site = pathlib.Path("_site")
          site.mkdir(exist_ok=True)

          shutil.copy(summary["dashboard"], site / "index.html")
          report = summary.get("report") or {}
          for key, name in (("markdown", "trial_report.md"), ("html", "trial_report.html")):
              source = report.get(key)
              if source and pathlib.Path(source).exists():
                  shutil.copy(source, site / name)

          overview = summary.get("overview") or {}
          (site / "README.md").write_text(
              "# Live readout\n\n"
              "This page is the dashboard produced by one run of the simulation:\n\n"
              f"* patients: {overview.get('n_patients')}\n"
              f"* adverse events: {overview.get('n_adverse_events')}\n"
              f"* primary endpoint: {overview.get('primary_endpoint')}\n"
              f"* protocol: {overview.get('protocol_id')}\n"
              f"* run id: {summary.get('run_id')}\n\n"
              "Synthetic data only. Not clinical evidence.\n"
              "\n## Read it as a story\n\n"
              "[story.html](story.html) walks the same run step by step: cohort, exposure, "
              "effect, safety, verdict.\n"
          )
          print("site files:", sorted(p.name for p in site.iterdir()))
          PY
      - name: Build the scrollytelling page
        run: |
          python scripts/build_story.py \
            --manifest "$(ls artifacts/pages/RUN-*/run_manifest.json | head -1)" \
            --out _site/story.html \
            --dashboard-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
