name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: src
  INSILICO_LOG_LEVEL: WARNING

jobs:
  lint-and-types:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,llm,tracking]'
      - name: Unit tests (no Spark)
        run: pytest -q -m "not spark" --cov=insilico_trial_mas --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  science-validation:
    name: Simulation plausibility and reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tracking]'
      - name: Calibration bands
        run: pytest -q tests/test_calibration.py
      - name: Two runs with the same seed must be identical
        run: python scripts/verify_reproducibility.py --patients 400 --epochs 4 --json
      - name: Verification notebook cells execute
        run: python scripts/run_notebook.py --patients 150 --epochs 3
      - name: UI (dashboard + studio endpoints)
        run: pytest -q tests/test_ui_dashboard.py tests/test_ui_studio.py
      - name: End-to-end demo produces a report
        run: |
          python -m insilico_trial_mas.cli demo --patients 200 --epochs 3 --output-dir artifacts/ci-demo --json > demo.json
          python - <<'PY'
          import json, pathlib
          payload = json.loads(pathlib.Path("demo.json").read_text())
          report = pathlib.Path(payload["report"]["markdown"])
          assert report.exists(), "the markdown report must be produced"
          text = report.read_text(encoding="utf-8")
          for section in ("Executive summary", "Safety", "Data quality", "Limitations"):
              assert section in text, f"missing report section: {section}"
          dashboard = pathlib.Path(payload["dashboard"])
          assert dashboard.exists(), "every run must produce a dashboard"
          html = dashboard.read_text(encoding="utf-8")
          for panel in ("overview", "efficacy", "safety", "patients", "reproducibility", "lineage"):
              assert f'data-panel="{panel}"' in html, f"missing dashboard panel: {panel}"
          assert "https://" not in html, "the dashboard must not reference external assets"
          print(f"report ok: {report} ({len(text)} chars, {payload['patients']} patients)")
          print(f"dashboard ok: {dashboard} ({len(html) // 1024} KB)")
          PY
      - name: Upload the dashboard artefact
        uses: actions/upload-artifact@v7
        with:
          name: simulation-dashboard
          path: artifacts/ci-demo/*/report/dashboard.html
          if-no-files-found: error

  spark-engine:
    name: Spark engine (local[*] driver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,spark]'
      - name: Spark engine must reproduce the sequential engine
        run: pytest -q -m spark

  docker:
    name: Docker image and compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Dockerfile
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" \
            hadolint/hadolint:2.12.0 hadolint --config /.hadolint.yaml - < Dockerfile

      - name: Build the runtime image
        run: docker build --target runtime -t insilico-trial-mas:ci .

      - name: Run a trial inside the container
        run: |
          docker run --rm --name insilico-ci -v ci-artifacts:/data insilico-trial-mas:ci \
            demo --patients 150 --epochs 4 --json > demo.json
          python - <<'PY'
          import json, pathlib
          payload = json.loads(pathlib.Path("demo.json").read_text())
          assert payload["patients"] > 0, payload
          assert "dashboard" in payload, payload
          print(f"container demo ok: {payload['patients']} patients, dashboard {payload['dashboard']}")
          PY

      - name: The image must not run as root
        run: |
          user=$(docker run --rm --entrypoint id insilico-trial-mas:ci -u)
          test "$user" = "10001" || { echo "expected uid 10001, got $user"; exit 1; }

      - name: Report templates must be packaged (guards a real regression)
        run: |
          docker run --rm --entrypoint python insilico-trial-mas:ci - <<'PY'
          import importlib.resources as resources
          for template in ("report.md.j2", "report.html.j2"):
              text = resources.files("insilico_trial_mas.templates").joinpath(template).read_text(encoding="utf-8")
              assert text.strip(), template
          print("report templates ship inside the wheel")
          PY

      - name: Compose file is valid and the Studio answers
        run: |
          docker compose config --quiet
          docker compose build studio
          docker compose up -d studio
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/config > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/config | head -c 200
          docker compose ps
          docker compose down -v

      - name: Build the test image (pytest + ruff + mypy run during the build)
        run: docker build --target test -t insilico-trial-mas:test .

  infrastructure:
    name: Terraform and bundle validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Formatting
        run: terraform -chdir=terraform fmt -recursive -check
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generated artefacts are current (architecture, social preview, UI previews)
        run: |
          python scripts/render_architecture.py --check
          python scripts/render_social_preview.py --check
          python scripts/render_ui_previews.py --check

      - name: Databricks bundle schema check
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'PY'
          """Validate the Asset Bundle against the resource model the CLI enforces.

          The previous version only inspected the simulation job's task keys, which let a
          job nested under an invalid resource type (`jobs_regression`) pass unnoticed,
          and did not notice a task declaring both a serverless environment and a classic
          cluster. Both were real defects in this repository.
          """
          import pathlib
          import yaml

          ALLOWED_RESOURCES = {"jobs", "pipelines", "experiments", "models", "clusters", "dashboards"}
          TOP_LEVEL_ENV = {"N_PATIENTS", "N_COHORTS", "EPOCHS", "SEED", "LLM_MODE", "OUTPUT_DIR",
                           "LOG_LEVEL", "PROTOCOL_PATH"}

          bundle = yaml.safe_load(pathlib.Path("databricks.yml").read_text())
          assert bundle["bundle"]["name"] == "insilico-trial-mas"
          assert set(bundle["targets"]) == {"dev", "prod"}

          definition = yaml.safe_load(pathlib.Path("resources/jobs.yml").read_text())
          resources = definition.get("resources") or {}
          unknown = set(resources) - ALLOWED_RESOURCES
          assert not unknown, f"invalid resource types under `resources`: {sorted(unknown)}"
          assert resources.get("jobs"), "the bundle must define at least one job"

          problems = []
          for job_name, job in resources["jobs"].items():
              assert isinstance(job, dict), f"{job_name}: a job must be a mapping"
              assert job.get("name"), f"{job_name}: missing name"
              for task in job.get("tasks", []):
                  compute = {k for k in ("environment_key", "new_cluster", "existing_cluster_id") if k in task}
                  if len(compute) != 1:
                      problems.append(f"{job_name}/{task.get('task_key')}: declares compute {sorted(compute)}")
                  for key in (task.get("spark_env_vars") or {}):
                      if not key.startswith("INSILICO_"):
                          problems.append(f"{job_name}/{task.get('task_key')}: {key} is not an INSILICO_* variable")
                          continue
                      body = key[len("INSILICO_"):]
                      if "__" not in body and body not in TOP_LEVEL_ENV:
                          problems.append(f"{job_name}/{task.get('task_key')}: {key} would be ignored by the loader")
          assert not problems, "bundle problems:\n  " + "\n  ".join(problems)

          tasks = resources["jobs"]["insilico_trial_simulation"]["tasks"]
          keys = [task["task_key"] for task in tasks]
          assert keys == ["validate_protocol", "simulate_trial", "train_physiology_model"], keys
          print(f"bundle ok: {len(resources['jobs'])} job(s), "
                f"{sum(len(j.get('tasks', [])) for j in resources['jobs'].values())} task(s)")
          PY
