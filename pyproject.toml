[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insilico-trial-mas"
version = "1.0.0"
description = "InSilicoTrial MAS - distributed multi-agent platform for in-silico clinical trial simulation and optimisation on Databricks & AWS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sergey Gerasimov", email = "sergey.gerasimov@hotmail.com" }]
keywords = ["clinical-trials", "multi-agent", "simulation", "pyspark", "databricks", "delta-lake", "mlflow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core runtime: pure-Python + scientific stack. Everything a local/CI run needs.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
# Distributed execution on Databricks / AWS EMR / local Spark.
spark = ["pyspark>=3.5,<4.0", "delta-spark>=3.1,<5.0"]
# Real LLM providers for the Synthetic Patient Persona agents.
llm = ["langchain-core>=0.2.0", "langchain-aws>=0.1.0", "boto3>=1.34"]
# Experiment tracking, model registry and tracing.
tracking = ["mlflow-skinny>=2.12"]
# Optional gradient boosting backend for the physiology model.
ml = ["scikit-learn>=1.4", "xgboost>=2.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]
all = [
  "pyspark>=3.5,<4.0",
  "delta-spark>=3.1,<5.0",
  "langchain-core>=0.2.0",
  "langchain-aws>=0.1.0",
  "boto3>=1.34",
  "mlflow-skinny>=2.12",
  "scikit-learn>=1.4",
]

[project.scripts]
insilico-trial = "insilico_trial_mas.cli:main"

[project.urls]
Homepage = "https://github.com/SergeyGer/InSilicoTrial_MAS"
Documentation = "https://github.com/SergeyGer/InSilicoTrial_MAS/tree/main/docs"
Changelog = "https://github.com/SergeyGer/InSilicoTrial_MAS/blob/main/CHANGELOG.md"
Issues = "https://github.com/SergeyGer/InSilicoTrial_MAS/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insilico_trial_mas = [
  "templates/*.j2",          # Jinja report templates (Markdown and HTML)
  "resources/*.yaml",        # population priors shipped with the package
  "py.typed",
]

# ---------------------------------------------------------------------------
# Test / lint / type-check configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "spark: requires a local JVM + pyspark (deselect with '-m \"not spark\"')",
  "slow: long-running end-to-end simulation tests",
  "network: requires outbound network access or cloud credentials",
]
filterwarnings = ["ignore::DeprecationWarning:pyarrow.*"]

[tool.coverage.run]
source = ["src/insilico_trial_mas"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "N803"]
# PySpark's conventional alias for the types module.
"src/insilico_trial_mas/engine/spark_runner.py" = ["N812"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["insilico_trial_mas"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
