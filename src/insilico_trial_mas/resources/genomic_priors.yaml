# ---------------------------------------------------------------------------
# Synthetic population priors for the cohort generator.
#
# IMPORTANT / DISCLAIMER
#   These frequencies and hazard weights are ILLUSTRATIVE values assembled for
#   simulation purposes only. They are order-of-magnitude consistent with
#   published pharmacogenomic and epidemiological literature, but they are NOT
#   a validated epidemiological source and MUST be replaced with a licensed
#   reference dataset (e.g. gnomAD, UK Biobank, NHANES) before any use in a
#   regulatory submission. No real patient data is used or required.
# ---------------------------------------------------------------------------
